# Builds Helios for Windows, macOS and Linux and publishes one GitHub Release.
# Runs when a version tag is pushed (git tag v0.2.0 && git push --tags) and can be
# started by hand from the Actions tab (Run workflow): that builds and uploads the
# three archives as workflow artifacts but creates no release.
#
# Jobs: check-version -> windows, macos, linux (in parallel) -> publish (tags only).
# The release text is docs/release-notes/<tag>.md (for example v0.2.0.md); it must
# be committed before the tag is pushed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the publish job may write (it creates the release).
permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check that the tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"Tag {tag} does not match pyproject.toml version {version} (expected v{version}).")

      - name: Check that the release notes exist
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "::error file=$notes::Missing or empty release notes: $notes. Commit it before pushing the tag."
            exit 1
          fi

  windows:
    needs: check-version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Build Helios.exe
        run: python -m PyInstaller --noconfirm --clean helios.spec

      - name: Check that Helios.exe starts
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
          HELIOS_DATA_DIR: ${{ runner.temp }}\helios-smoke
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Helios\Helios.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Helios.exe --smoke-test exited with code $($p.ExitCode)" }
          if (-not (Test-Path "$env:HELIOS_DATA_DIR\data\galaxy.json")) { throw "Helios.exe did not create its data file" }

      - name: Zip the build
        shell: pwsh
        run: Compress-Archive -Path "dist\Helios" -DestinationPath "Helios-windows.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: Helios-windows
          path: Helios-windows.zip
          if-no-files-found: error

  macos:
    needs: check-version
    runs-on: macos-latest  # Apple Silicon (arm64)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Build Helios.app
        run: python -m PyInstaller --noconfirm --clean helios.spec

      - name: Show the app's version and minimum macOS
        run: |
          plist=dist/Helios.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$plist"
          /usr/libexec/PlistBuddy -c "Print LSMinimumSystemVersion" "$plist"

      - name: Check that Helios.app starts
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export HELIOS_DATA_DIR="$RUNNER_TEMP/helios-smoke"
          dist/Helios.app/Contents/MacOS/Helios --smoke-test
          test -f "$HELIOS_DATA_DIR/data/galaxy.json" || { echo "::error::Helios.app did not create its data file"; exit 1; }

      # ditto keeps the symlinks inside the Qt frameworks; a plain zip would break them.
      - name: Zip the app
        run: ditto -c -k --keepParent dist/Helios.app Helios-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Helios-macos
          path: Helios-macos.zip
          if-no-files-found: error

  linux:
    needs: check-version
    # The oldest supported runner, so the build also runs on older Linux systems
    # (PySide6 itself needs glibc 2.34 or newer). GitHub plans to retire this image
    # around April 2027; then move to ubuntu-24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Qt's runtime libraries: the tests and the smoke test need them, and
      # PyInstaller must find them to resolve the Qt plugins' dependencies.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Build Helios
        run: python -m PyInstaller --noconfirm --clean helios.spec

      - name: Check that Helios starts
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export HELIOS_DATA_DIR="$RUNNER_TEMP/helios-smoke"
          dist/Helios/Helios --smoke-test
          test -f "$HELIOS_DATA_DIR/data/galaxy.json" || { echo "::error::Helios did not create its data file"; exit 1; }

      # tar keeps the executable bits and symlinks; the archive holds the Helios/ folder.
      - name: Pack the build
        run: tar -C dist -czf Helios-linux.tar.gz Helios

      - uses: actions/upload-artifact@v7
        with:
          name: Helios-linux
          path: Helios-linux.tar.gz
          if-no-files-found: error

  publish:
    needs: [check-version, windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # needed to create the GitHub Release
    steps:
      - uses: actions/checkout@v7

      - name: Check that the release notes exist
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "::error file=$notes::Missing or empty release notes: $notes. Commit it before pushing the tag."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: Helios-*
          path: release-files
          merge-multiple: true

      - name: Check that all three archives are there
        run: |
          ls -l release-files
          for f in Helios-windows.zip Helios-macos.zip Helios-linux.tar.gz; do
            test -s "release-files/$f" || { echo "::error::Missing release file $f"; exit 1; }
          done

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            release-files/Helios-windows.zip
            release-files/Helios-macos.zip
            release-files/Helios-linux.tar.gz
          fail_on_unmatched_files: true
